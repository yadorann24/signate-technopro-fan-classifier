name: Synthetic validation

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NO_ALBUMENTATIONS_UPDATE: "1"
      HF_HUB_OFFLINE: "1"
      OMP_NUM_THREADS: "1"
      TF_NUM_INTRAOP_THREADS: "1"
      TF_NUM_INTEROP_THREADS: "1"
      TF_CPP_MIN_LOG_LEVEL: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the tested CPU environment
        run: |
          python -m pip install --require-hashes -r requirements-stratification-cpu.lock
          python -m pip install --no-deps -e '.[stratification]'
          python -m pip install ruff==0.11.13
          python -m pip check
      - name: Check source and publication contents
        run: |
          ruff check src tests scripts
          python scripts/check_public_files.py
      - name: Test synthetic images and model interfaces without weight downloads
        run: python -m unittest discover -s tests -v
