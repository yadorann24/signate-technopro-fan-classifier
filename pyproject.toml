[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signate-fan-classifier"
version = "0.1.0"
description = "Configurable EVA image classification pipeline for the Technopro SIGNATE solution"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch==2.5.1",
  "torchvision==0.20.1",
  "timm==1.0.11",
  # timm 1.0.11 imports Hub APIs removed in newer major versions.
  "huggingface-hub==0.36.0",
  "albumentations==1.4.21",
  "numpy==1.26.4",
  "opencv-python-headless==4.10.0.84",
  "scikit-learn==1.5.2",
]

[project.optional-dependencies]
stratification = ["tensorflow-cpu==2.18.0"]

[project.scripts]
fan-classifier = "fan_classifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
